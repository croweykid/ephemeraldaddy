[project]
name = "ephemeraldaddy"
dynamic = ["version"]
description = "A modular, research-ready astrology toolkit."
authors = [{name="Your Name"}]
dependencies = [
  "skyfield>=1.49",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "Pillow>=10.0",
  #emoji>=2,
  "rich>=13.7",
  "timezonefinder>=6.0",
  "geopy>=2.0",
  "pyswisseph>=2.10",
  "PySide6>=6.7",
  "requests>=2.32",
  "lunar-python>=1.4",
  "pyinstaller>=6.0",
]

[project.scripts]
ephemeraldaddy = "ephemeraldaddy.gui.bootstrap:main"

[tool.setuptools.package-data]
"ephemeraldaddy.analysis" = ["default_traits.json"]
"ephemeraldaddy.gui" = ["fonts/*.ttf", "fonts/*.otf", "fonts/*.ttc", "fonts/*.md"]

[tool.setuptools.packages.find]
include = ["ephemeraldaddy*"]

[tool.setuptools.dynamic]
version = {attr = "ephemeraldaddy.version.__version__"}

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
