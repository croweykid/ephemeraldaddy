[project]
name = "ephemeraldaddy"
version = "0.1.0"
description = "A modular, research-ready astrology toolkit."
authors = [{name="Your Name"}]
dependencies = [
  "skyfield>=1.49",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "Pillow>=10.0",
  #emoji>=2,
  "rich>=13.7",
  "timezonefinder>=6.0",
  "geopy>=2.0",
  "pyswisseph>=2.10",
  "PySide6>=6.7",
  "requests>=2.32",
  "lunar-python>=1.4",
  "pyinstaller>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ephemeraldaddy = "ephemeraldaddy.gui.bootstrap:main"

[tool.setuptools.package-data]
"ephemeraldaddy.analysis" = ["default_traits.json"]
"ephemeraldaddy.gui" = ["fonts/*.ttf", "fonts/*.otf", "fonts/*.ttc", "fonts/*.md"]
"ephemeraldaddy.gui.features.popouts" = ["assets/*.html"]

[tool.setuptools.packages.find]
include = ["ephemeraldaddy*"]
exclude = [
  "ephemeraldaddy.data.compiled",
  "ephemeraldaddy.graphics.alternate icons",
  "ephemeraldaddy.graphics.chartwheel_components",
  "ephemeraldaddy.graphics.emoji",
  "ephemeraldaddy.help",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
