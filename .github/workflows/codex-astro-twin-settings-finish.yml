name: Finish Astro Twin settings cleanup

on:
  push:
    branches:
      - codex/tidy-astro-twin-settings-and-ranking-actions

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tidy-astro-twin-settings-and-ranking-actions
          fetch-depth: 0

      - name: Apply candidate patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/codex-astro-twin-settings-finalize.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          script = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script.splitlines())
          exec(compile(script, '<astro-twin-patch>', 'exec'))
          PY

      - name: Repair generated assertion quoting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_astro_twin_settings_layout_source.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    assert "calculator_checkboxes[key].setChecked(bool(factor.get("enabled", False)))" in SECTION\n',
              '    assert \'calculator_checkboxes[key].setChecked(bool(factor.get("enabled", False)))\' in SECTION\n',
          )
          text = text.replace(
              '    assert "calculator_weights[key].setValue(float(factor.get("weight", 0.0)))" in SECTION\n',
              '    assert \'calculator_weights[key].setValue(float(factor.get("weight", 0.0)))\' in SECTION\n',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile changed Python
        run: |
          python -m py_compile ephemeraldaddy/gui/dev_tools.py
          python -m py_compile ephemeraldaddy/gui/features/charts/similarities_algorithm_log.py
          python -m py_compile tests/test_astro_twin_settings_layout_source.py

      - name: Run focused regressions
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_astro_twin_settings_layout_source.py

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/codex-astro-twin-settings-finalize.yml
          rm -f .github/workflows/codex-astro-twin-settings-diagnose.yml
          rm -f .github/workflows/codex-astro-twin-settings-finish.yml

      - name: Commit finalized feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Astro Twin settings and ranking actions"
          git push origin HEAD:codex/tidy-astro-twin-settings-and-ranking-actions
