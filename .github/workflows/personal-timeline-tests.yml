name: Personal Timeline tests

on:
  pull_request:
    paths:
      - "ephemeraldaddy/gui/features/charts/dominance_relevance.py"
      - "ephemeraldaddy/gui/features/transits/cache.py"
      - "ephemeraldaddy/gui/features/transits/personal_timeline*.py"
      - "ephemeraldaddy/gui/window_chrome.py"
      - "tests/test_personal_timeline*.py"
      - "ephemeraldaddy/core/aspect_display.py"
      - "ephemeraldaddy/core/composite.py"
      - "ephemeraldaddy/gui/features/charts/presentation.py"
      - "ephemeraldaddy/gui/features/charts/text_summary.py"
      - "tests/test_transit_axis_and_eligibility_regressions.py"
      - ".github/workflows/personal-timeline-tests.yml"
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused tests
        run: >-
          python -m pytest -q
          tests/test_personal_timeline.py
          tests/test_personal_timeline_window.py
          tests/test_personal_timeline_filters.py
          tests/test_personal_timeline_analysis.py
          tests/test_personal_timeline_cache.py
          tests/test_personal_timeline_persistence.py
          tests/test_personal_timeline_sorting.py
          tests/test_transit_axis_and_eligibility_regressions.py
