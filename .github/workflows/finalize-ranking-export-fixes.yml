name: Finalize ranking export fixes

on:
  push:
    branches:
      - fix/ranking-export-render-save-errors

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ranking-export-render-save-errors
          fetch-depth: 0

      - name: Apply ranking export fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ephemeraldaddy/gui/ranking_panel.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one {label} anchor, found {count}')
              text = text.replace(old, new)

          replace_once(
              'from PySide6.QtCore import QObject, QThread, QTimer, Qt, Signal, Slot',
              'from PySide6.QtCore import QObject, QPoint, QThread, QTimer, Qt, Signal, Slot',
              'QtCore import',
          )
          replace_once(
              '    QLabel,\n    QPushButton,\n',
              '    QLabel,\n    QMessageBox,\n    QPushButton,\n',
              'QMessageBox import',
          )
          replace_once(
              '        painter = None\n        try:\n',
              '        painter = None\n        save_succeeded = False\n        try:\n',
              'save state',
          )
          replace_once(
              '            label.render(painter)\n',
              '            label.render(painter, QPoint())\n',
              'render call',
          )
          replace_once(
              '            pixmap.save(save_path, "PNG")\n',
              '            save_succeeded = pixmap.save(save_path, "PNG")\n',
              'PNG save call',
          )
          marker = '            label.resize(original_size)\n\n    def _on_rankings_section_toggled'
          replacement = (
              '            label.resize(original_size)\n'
              '\n'
              '        if not save_succeeded:\n'
              '            QMessageBox.critical(\n'
              '                self,\n'
              '                "Export failed",\n'
              '                f"Could not save the ranking PNG to:\\n{save_path}",\n'
              '            )\n'
              '\n'
              '    def _on_rankings_section_toggled'
          )
          replace_once(marker, replacement, 'export failure message')

          required = (
              'from PySide6.QtCore import QObject, QPoint, QThread, QTimer, Qt, Signal, Slot',
              '    QMessageBox,',
              'label.render(painter, QPoint())',
              'save_succeeded = pixmap.save(save_path, "PNG")',
              'if not save_succeeded:',
              'QMessageBox.critical(',
          )
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'Missing expected ranking export fix tokens: {missing}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Python sources
        run: python -m compileall -q ephemeraldaddy tests

      - name: Commit production change and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-ranking-export-fixes.yml
          git rm .github/workflows/_temp_ranking_export_fixes.yml
          git add ephemeraldaddy/gui/ranking_panel.py
          git commit -m "Fix ranking PNG export failures"
          git push origin HEAD:fix/ranking-export-render-save-errors
