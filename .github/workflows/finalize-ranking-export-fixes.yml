name: Finalize ranking export fixes

on:
  push:
    branches:
      - fix/ranking-export-render-save-errors

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ranking-export-render-save-errors
          fetch-depth: 0

      - name: Apply ranking export fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ephemeraldaddy/gui/ranking_panel.py')
          text = path.read_text(encoding='utf-8')

          old_core = 'from PySide6.QtCore import QObject, QThread, QTimer, Qt, Signal, Slot'
          new_core = 'from PySide6.QtCore import QObject, QPoint, QThread, QTimer, Qt, Signal, Slot'
          if text.count(old_core) != 1:
              raise SystemExit(f'Expected one QtCore import anchor, found {text.count(old_core)}')
          text = text.replace(old_core, new_core)

          old_widgets = '    QLabel,\n    QPushButton,\n'
          new_widgets = '    QLabel,\n    QMessageBox,\n    QPushButton,\n'
          if text.count(old_widgets) != 1:
              raise SystemExit(f'Expected one widget import anchor, found {text.count(old_widgets)}')
          text = text.replace(old_widgets, new_widgets)

          old_block = '''        painter = None
          try:
              label.resize(export_width, export_height)
              pixmap = QPixmap(export_width, export_height)
              pixmap.fill(QColor("#17191d"))
              painter = QPainter(pixmap)
              label.render(painter)
              painter.end()
              painter = None
              pixmap.save(save_path, "PNG")
          finally:
              if painter is not None and painter.isActive():
                  painter.end()
              label.resize(original_size)
          '''
          new_block = '''        painter = None
          save_succeeded = False
          try:
              label.resize(export_width, export_height)
              pixmap = QPixmap(export_width, export_height)
              pixmap.fill(QColor("#17191d"))
              painter = QPainter(pixmap)
              label.render(painter, QPoint())
              painter.end()
              painter = None
              save_succeeded = pixmap.save(save_path, "PNG")
          finally:
              if painter is not None and painter.isActive():
                  painter.end()
              label.resize(original_size)

          if not save_succeeded:
              QMessageBox.critical(
                  self,
                  "Export failed",
                  f"Could not save the ranking PNG to:\\n{save_path}",
              )
          '''
          if text.count(old_block) != 1:
              raise SystemExit(f'Expected one export render/save block, found {text.count(old_block)}')
          text = text.replace(old_block, new_block)

          required = (
              'from PySide6.QtCore import QObject, QPoint, QThread, QTimer, Qt, Signal, Slot',
              '    QMessageBox,',
              'label.render(painter, QPoint())',
              'save_succeeded = pixmap.save(save_path, "PNG")',
              'if not save_succeeded:',
              'QMessageBox.critical(',
          )
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'Missing expected ranking export fix tokens: {missing}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Python sources
        run: python -m compileall -q ephemeraldaddy tests

      - name: Commit production change and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-ranking-export-fixes.yml
          git rm .github/workflows/_temp_ranking_export_fixes.yml
          git add ephemeraldaddy/gui/ranking_panel.py
          git commit -m "Fix ranking PNG export failures"
          git push origin HEAD:fix/ranking-export-render-save-errors
