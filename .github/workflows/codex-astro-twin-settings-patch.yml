name: Apply Astro Twin settings patch

on:
  push:
    branches:
      - codex/tidy-astro-twin-settings-and-ranking-actions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tidy-astro-twin-settings-and-ranking-actions
          fetch-depth: 0

