name: Apply Draconic review fixes

on:
  push:
    branches:
      - feature/draconic-positions-output

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/draconic-positions-output
          fetch-depth: 0

      - name: Apply asserted source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1 + 2: preserve directed D. -> N. endpoints and remove the splitlines string hack.
          path = Path('ephemeraldaddy/gui/features/charts/text_summary.py')
          text = path.read_text()

          class_pattern = re.compile(
              r'\nclass _ChartSummaryText\(str\):\n.*?\n\ndef _sign_dignity_prefix',
              re.S,
          )
          text, class_count = class_pattern.subn('\n\ndef _sign_dignity_prefix', text, count=1)
          assert class_count == 1, f'expected one _ChartSummaryText class, found {class_count}'

          wrapped_return = '_ChartSummaryText("\\n".join(lines))'
          wrapped_count = text.count(wrapped_return)
          assert wrapped_count >= 1, 'expected _ChartSummaryText return wrappers'
          text = text.replace(wrapped_return, '"\\n".join(lines)')

          sort_pattern = re.compile(
              r'(?m)^    sorted_aspects = sort_natal_aspects\(\n'
              r'        cross_aspects,\n'
              r'        sort_mode,\n'
              r'        planet_weights=dominant_planet_weights,\n'
              r'    \)$'
          )
          sort_replacement = (
              '    sorted_aspects = sort_natal_aspects(\n'
              '        cross_aspects,\n'
              '        sort_mode,\n'
              '        planet_weights=dominant_planet_weights,\n'
              '        preserve_endpoint_order=True,\n'
              '    )'
          )
          text, sort_count = sort_pattern.subn(sort_replacement, text, count=1)
          assert sort_count == 1, f'expected one Draconic sort call, found {sort_count}'
          path.write_text(text)

          # 2 + 3: update real popout callers explicitly. Both header forms remain valid;
          # the transit popout stops before the natal-only Draconic sections.
          path = Path('ephemeraldaddy/gui/app.py')
          text = path.read_text()
          legacy_lookup = 'line.strip() == "POSITIONS"'
          lookup_count = text.count(legacy_lookup)
          assert lookup_count == 2, f'expected two legacy POSITIONS lookups, found {lookup_count}'
          text = text.replace(
              legacy_lookup,
              'line.strip() in {"POSITIONS", "POSITIONS (Tropical)"}',
          )

          transit_pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)visible_summary_lines = summary_lines_local\[positions_start_index:\]\n'
              r'(?P=indent)transit_visible_lines: list\[str\] = \[\]$'
          )

          def transit_replacement(match: re.Match[str]) -> str:
              i = match.group('indent')
              ii = i + '    '
              iii = ii + '    '
              return (
                  f'{i}draconic_start_index = next(\n'
                  f'{ii}(\n'
                  f'{iii}idx\n'
                  f'{iii}for idx, line in enumerate(summary_lines_local)\n'
                  f'{iii}if line.strip() in {{"DRACONIC POSITIONS", "POSITIONS (Draconic)"}}\n'
                  f'{ii}),\n'
                  f'{ii}len(summary_lines_local),\n'
                  f'{i})\n'
                  f'{i}visible_summary_lines = summary_lines_local[\n'
                  f'{ii}positions_start_index:draconic_start_index\n'
                  f'{i}]\n'
                  f'{i}transit_visible_lines: list[str] = []'
              )

          text, transit_count = transit_pattern.subn(transit_replacement, text)
          assert transit_count == 1, f'expected one transit summary block, found {transit_count}'
          path.write_text(text)

          # 4: register all qualified headers with the canonical Chart Data style.
          path = Path('ephemeraldaddy/gui/style.py')
          text = path.read_text()
          headers_pattern = re.compile(
              r'CHART_DATA_SECTION_HEADERS = \(\n'
              r'    "CHART INFO",\n'
              r'    "CORE DESIGNATION",\n'
              r'    "POSITIONS",\n'
              r'    "HOUSES",\n'
              r'    "ASPECTS",'
          )
          headers_replacement = (
              'CHART_DATA_SECTION_HEADERS = (\n'
              '    "CHART INFO",\n'
              '    "CORE DESIGNATION",\n'
              '    "POSITIONS",\n'
              '    "POSITIONS (Tropical)",\n'
              '    "POSITIONS (Draconic)",\n'
              '    "HOUSES",\n'
              '    "ASPECTS",\n'
              '    "ASPECTS (Draconic)",'
          )
          text, header_count = headers_pattern.subn(headers_replacement, text, count=1)
          assert header_count == 1, f'canonical Chart Data header tuple shape changed ({header_count})'
          path.write_text(text)

          # Regression coverage: qualified Tropical survives normal string splitting;
          # legacy aliases remain recognized.
          Path('tests/test_chart_data_position_headers.py').write_text('''from ephemeraldaddy.gui.features.charts.text_summary import (\n    DRACONIC_POSITION_HEADER_ALIASES,\n    POSITION_HEADER_ALIASES,\n    _header_matches,\n)\n\n\ndef test_tropical_position_header_accepts_legacy_and_qualified_forms() -> None:\n    assert _header_matches("POSITIONS", POSITION_HEADER_ALIASES)\n    assert _header_matches("POSITIONS (Tropical)", POSITION_HEADER_ALIASES)\n\n\ndef test_draconic_position_header_accepts_legacy_and_qualified_forms() -> None:\n    assert _header_matches("DRACONIC POSITIONS", DRACONIC_POSITION_HEADER_ALIASES)\n    assert _header_matches("POSITIONS (Draconic)", DRACONIC_POSITION_HEADER_ALIASES)\n\n\ndef test_tropical_qualifier_survives_standard_splitlines() -> None:\n    summary = "HEADER\\nPOSITIONS (Tropical)\\nBody  Sign"\n\n    assert "POSITIONS (Tropical)" in summary\n    assert summary.splitlines()[1] == "POSITIONS (Tropical)"\n''')

          Path('tests/test_draconic_output_regressions.py').write_text('''from ephemeraldaddy.gui.features.charts.aspect_sorting import sort_natal_aspects\nfrom ephemeraldaddy.gui.style import CHART_DATA_SECTION_HEADERS\n\n\ndef _directed_aspect() -> dict:\n    return {\n        "p1": "Mars",\n        "p2": "Sun",\n        "type": "trine",\n        "angle": 120.0,\n        "delta": 0.0,\n    }\n\n\ndef test_position_sort_can_preserve_directed_endpoints() -> None:\n    result = sort_natal_aspects(\n        [_directed_aspect()],\n        "Position",\n        preserve_endpoint_order=True,\n    )\n    assert result[0]["p1"] == "Mars"\n    assert result[0]["p2"] == "Sun"\n\n\ndef test_default_position_sort_still_normalizes_symmetric_natal_endpoints() -> None:\n    result = sort_natal_aspects([_directed_aspect()], "Position")\n    assert result[0]["p1"] == "Sun"\n    assert result[0]["p2"] == "Mars"\n\n\ndef test_draconic_and_tropical_headers_are_registered_for_chart_data_styling() -> None:\n    assert "POSITIONS" in CHART_DATA_SECTION_HEADERS\n    assert "POSITIONS (Tropical)" in CHART_DATA_SECTION_HEADERS\n    assert "POSITIONS (Draconic)" in CHART_DATA_SECTION_HEADERS\n    assert "ASPECTS (Draconic)" in CHART_DATA_SECTION_HEADERS\n''')

          assert '_ChartSummaryText' not in Path('ephemeraldaddy/gui/features/charts/text_summary.py').read_text()
          PY

      - name: Validate syntax
        shell: bash
        run: |
          python -m py_compile \
            ephemeraldaddy/gui/features/charts/aspect_sorting.py \
            ephemeraldaddy/gui/features/charts/text_summary.py \
            ephemeraldaddy/gui/style.py \
            ephemeraldaddy/gui/app.py \
            tests/test_chart_data_position_headers.py \
            tests/test_draconic_output_regressions.py

      - name: Remove temporary workflow and commit fixes
        shell: bash
        run: |
          rm .github/workflows/_temporary_apply_draconic_review_fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Address Draconic Chart Data review fixes"
          git push origin HEAD:feature/draconic-positions-output
