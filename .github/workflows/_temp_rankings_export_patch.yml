name: Temporary rankings export patch

on:
  push:
    branches:
      - feature/rankings-export-visible-rows
    paths:
      - .github/workflows/_temp_rankings_export_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rankings-export-visible-rows
          fetch-depth: 0
      - name: Patch rankings panel
        run: python .github/scripts/_temp_patch_rankings.py
      - name: Validate Python source
        run: python -m compileall ephemeraldaddy tests
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add ephemeraldaddy/gui/ranking_panel.py
          git diff --cached --check
          git commit -m "Add ranking exports and incremental sign rankings"
          git push origin HEAD:feature/rankings-export-visible-rows
