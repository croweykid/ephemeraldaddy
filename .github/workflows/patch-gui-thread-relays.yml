name: Apply GUI thread relay patch

on:
  push:
    branches:
      - fix/gui-thread-dialogs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gui-thread-dialogs
          fetch-depth: 0

      - name: Patch worker terminal delivery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path("ephemeraldaddy/gui/app.py")
          traits_path = Path("ephemeraldaddy/gui/features/settings/traits_manager.py")

          app = app_path.read_text(encoding="utf-8")
          traits = traits_path.read_text(encoding="utf-8")

          app_import = (
              "from ephemeraldaddy.gui.worker_ui_relays import (\n"
              "    PlanetDynamicsUiRelay,\n"
              "    SimilarChartsUiRelay,\n"
              ")\n"
          )
          if app_import not in app:
              future = "from __future__ import annotations\n"
              if future in app:
                  app = app.replace(future, future + "\n" + app_import, 1)
              else:
                  app = app_import + "\n" + app

          similar_pattern = re.compile(
              r"(?P<indent>^[ \t]*)worker\.finished\.connect\(\s*"
              r"lambda request_id, payload, worker=worker:\s*"
              r"self\._on_similar_charts_worker_finished\(\s*"
              r"worker,\s*request_id,\s*payload\s*\)\s*\)\s*"
              r"(?P=indent)worker\.failed\.connect\(\s*"
              r"lambda request_id, message, worker=worker:\s*"
              r"self\._on_similar_charts_worker_failed\(\s*"
              r"worker,\s*request_id,\s*message\s*\)\s*\)",
              re.MULTILINE,
          )

          def replace_similar(match: re.Match[str]) -> str:
              i = match.group("indent")
              return (
                  f"{i}similar_ui_relay = SimilarChartsUiRelay(\n"
                  f"{i}    self,\n"
                  f"{i}    on_finished=lambda request_id, payload, worker=worker: "
                  "self._on_similar_charts_worker_finished(\n"
                  f"{i}        worker, request_id, payload\n"
                  f"{i}    ),\n"
                  f"{i}    on_failed=lambda request_id, message, worker=worker: "
                  "self._on_similar_charts_worker_failed(\n"
                  f"{i}        worker, request_id, message\n"
                  f"{i}    ),\n"
                  f"{i})\n"
                  f"{i}worker.finished.connect(similar_ui_relay.handle_finished, Qt.QueuedConnection)\n"
                  f"{i}worker.failed.connect(similar_ui_relay.handle_failed, Qt.QueuedConnection)"
              )

          app, similar_count = similar_pattern.subn(replace_similar, app, count=1)
          if similar_count != 1:
              raise SystemExit(f"Expected one Similar Charts terminal callback block; found {similar_count}")

          planet_pattern = re.compile(
              r"(?P<indent>^[ \t]*)worker\.finished\.connect\(\s*"
              r"lambda request_id, chart_uid, render_signature, dynamics, worker=worker:\s*"
              r"self\._on_planet_dynamics_worker_finished\(\s*"
              r"worker,\s*request_id,\s*chart_uid,\s*render_signature,\s*dynamics\s*\)\s*\)\s*"
              r"(?P=indent)worker\.failed\.connect\(\s*"
              r"lambda request_id, chart_uid, render_signature, message, worker=worker:\s*"
              r"self\._on_planet_dynamics_worker_failed\(\s*"
              r"worker,\s*request_id,\s*chart_uid,\s*render_signature,\s*message\s*\)\s*\)",
              re.MULTILINE,
          )

          def replace_planet(match: re.Match[str]) -> str:
              i = match.group("indent")
              return (
                  f"{i}planet_dynamics_ui_relay = PlanetDynamicsUiRelay(\n"
                  f"{i}    self,\n"
                  f"{i}    on_finished=lambda request_id, chart_uid, render_signature, dynamics, worker=worker: "
                  "self._on_planet_dynamics_worker_finished(\n"
                  f"{i}        worker, request_id, chart_uid, render_signature, dynamics\n"
                  f"{i}    ),\n"
                  f"{i}    on_failed=lambda request_id, chart_uid, render_signature, message, worker=worker: "
                  "self._on_planet_dynamics_worker_failed(\n"
                  f"{i}        worker, request_id, chart_uid, render_signature, message\n"
                  f"{i}    ),\n"
                  f"{i})\n"
                  f"{i}worker.finished.connect(planet_dynamics_ui_relay.handle_finished, Qt.QueuedConnection)\n"
                  f"{i}worker.failed.connect(planet_dynamics_ui_relay.handle_failed, Qt.QueuedConnection)"
              )

          app, planet_count = planet_pattern.subn(replace_planet, app, count=1)
          if planet_count != 1:
              raise SystemExit(f"Expected one Planet Dynamics terminal callback block; found {planet_count}")

          trait_import = "from ephemeraldaddy.gui.worker_ui_relays import TraitReassessmentUiRelay\n"
          if trait_import not in traits:
              future = "from __future__ import annotations\n"
              traits = traits.replace(future, future + "\n" + trait_import, 1)

          old_trait_connections = (
              "    worker.finished.connect(reassessment_finished, Qt.QueuedConnection)\n"
              "    worker.failed.connect(reassessment_failed, Qt.QueuedConnection)\n"
          )
          new_trait_connections = (
              "    ui_relay = TraitReassessmentUiRelay(\n"
              "        owner,\n"
              "        on_finished=reassessment_finished,\n"
              "        on_failed=reassessment_failed,\n"
              "    )\n"
              "    worker.finished.connect(ui_relay.handle_finished, Qt.QueuedConnection)\n"
              "    worker.failed.connect(ui_relay.handle_failed, Qt.QueuedConnection)\n"
          )
          if traits.count(old_trait_connections) != 1:
              raise SystemExit(
                  "Expected one Trait reassessment terminal callback block; "
                  f"found {traits.count(old_trait_connections)}"
              )
          traits = traits.replace(old_trait_connections, new_trait_connections, 1)

          app_path.write_text(app, encoding="utf-8")
          traits_path.write_text(traits, encoding="utf-8")
          PY

      - name: Verify source regression and syntax
        shell: bash
        run: |
          python -m py_compile \
            ephemeraldaddy/gui/app.py \
            ephemeraldaddy/gui/worker_ui_relays.py \
            ephemeraldaddy/gui/features/settings/traits_manager.py \
            tests/test_worker_gui_thread_delivery_source.py
          python - <<'PY'
          import runpy
          namespace = runpy.run_path("tests/test_worker_gui_thread_delivery_source.py")
          for name, value in sorted(namespace.items()):
              if name.startswith("test_") and callable(value):
                  value()
                  print(f"PASS {name}")
          PY
          git diff --check

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ephemeraldaddy/gui/app.py ephemeraldaddy/gui/features/settings/traits_manager.py
          git diff --cached --exit-code && { echo "No patch changes produced"; exit 1; } || true
          git commit -m "Route worker terminal callbacks through GUI thread relays"
          git push origin HEAD:fix/gui-thread-dialogs
