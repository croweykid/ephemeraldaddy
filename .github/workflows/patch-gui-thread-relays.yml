name: Apply GUI thread relay patch

on:
  push:
    branches:
      - fix/gui-thread-dialogs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gui-thread-dialogs
          fetch-depth: 1
      - name: Inspect target worker connections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("ephemeraldaddy/gui/app.py").read_text(encoding="utf-8")
          for needle in (
              "_on_similar_charts_worker_finished",
              "_on_planet_dynamics_worker_finished",
          ):
              positions = []
              start = 0
              while True:
                  index = source.find(needle, start)
                  if index < 0:
                      break
                  positions.append(index)
                  start = index + len(needle)
              print(f"\n===== {needle}: {len(positions)} occurrence(s) =====")
              for index in positions:
                  print(source[max(0, index - 700): index + 900])
                  print("===== END =====")
          PY
