name: Apply GUI thread relay patch

on:
  push:
    branches:
      - fix/gui-thread-dialogs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gui-thread-dialogs
          fetch-depth: 1
      - name: Inspect worker signal signatures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("ephemeraldaddy/gui/app.py").read_text(encoding="utf-8")
          for needle in ("class _PlanetDynamicsWorker", "class _ChartRenderWorker"):
              index = source.find(needle)
              print(f"===== {needle} @ {index} =====")
              if index >= 0:
                  print(source[index:index + 1800])
          PY
