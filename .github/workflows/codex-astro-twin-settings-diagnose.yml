name: Diagnose Astro Twin settings cleanup

on:
  push:
    branches:
      - codex/tidy-astro-twin-settings-and-ranking-actions

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tidy-astro-twin-settings-and-ranking-actions

      - name: Apply candidate patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/codex-astro-twin-settings-finalize.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          script = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script.splitlines())
          exec(compile(script, '<astro-twin-patch>', 'exec'))
          PY

      - name: Compile dev tools
        run: python -m py_compile ephemeraldaddy/gui/dev_tools.py

      - name: Compile ranking formatter
        run: python -m py_compile ephemeraldaddy/gui/features/charts/similarities_algorithm_log.py

      - name: Install pytest
        run: python -m pip install -q pytest

      - name: Test algorithm caption and demographic position
        run: python -m pytest -q tests/test_astro_twin_settings_layout_source.py::test_algorithm_caption_leads_and_demographic_matching_follows_custom_subpanel
      - name: Test demographic labels
        run: python -m pytest -q tests/test_astro_twin_settings_layout_source.py::test_demographic_matching_labels_order_and_no_tooltips
      - name: Test database distinction order
        run: python -m pytest -q tests/test_astro_twin_settings_layout_source.py::test_database_distinction_precedes_custom_as_final_scoring_option
      - name: Test database distinction tooltip
        run: python -m pytest -q tests/test_astro_twin_settings_layout_source.py::test_database_distinction_explanation_is_tooltip_only
      - name: Test custom panel visual order
        run: python -m pytest -q tests/test_astro_twin_settings_layout_source.py::test_custom_subpanel_has_visual_cues_and_preset_button_at_bottom
      - name: Test custom weight grid
        run: python -m pytest -q tests/test_astro_twin_settings_layout_source.py::test_custom_weight_grid_uses_centered_renamed_headers_and_compact_columns
      - name: Test placement mode inline
        run: python -m pytest -q tests/test_astro_twin_settings_layout_source.py::test_placement_weight_mode_is_inline_with_placement_criterion_without_label
      - name: Test placement mode tooltips
        run: python -m pytest -q tests/test_astro_twin_settings_layout_source.py::test_placement_weighting_modes_have_item_and_selected_tooltips
      - name: Test selected scoring style
        run: python -m pytest -q tests/test_astro_twin_settings_layout_source.py::test_selected_scoring_method_uses_chart_data_highlight_color
      - name: Test total completion display
        run: python -m pytest -q tests/test_astro_twin_settings_layout_source.py::test_total_only_shows_green_completion_percentage_at_one
      - name: Test custom preset selector
        run: python -m pytest -q tests/test_astro_twin_settings_layout_source.py::test_custom_preset_selector_and_in_use_state_are_wired
      - name: Test loaded preset save choices
        run: python -m pytest -q tests/test_astro_twin_settings_layout_source.py::test_saving_loaded_preset_offers_exact_update_or_new_choices
      - name: Test preset manager placement
        run: python -m pytest -q tests/test_astro_twin_settings_layout_source.py::test_manage_presets_button_is_file_gated_and_right_of_selector
      - name: Test research ranking layout
        run: python -m pytest -q tests/test_astro_twin_settings_layout_source.py::test_research_accuracy_ranking_fills_space_below_button_and_divider
      - name: Test research use action
        run: python -m pytest -q tests/test_astro_twin_settings_layout_source.py::test_research_use_this_applies_mode_custom_snapshot_and_all_or_nothing_criterion
      - name: Test research weight coloring
        run: python -m pytest -q tests/test_astro_twin_settings_layout_source.py::test_research_weight_coloring_uses_shared_zero_based_red_green_scale
      - name: Test ranking factor filtering
        run: python -m pytest -q tests/test_astro_twin_settings_layout_source.py::test_ranking_formatter_has_use_action_and_filters_disabled_factors
