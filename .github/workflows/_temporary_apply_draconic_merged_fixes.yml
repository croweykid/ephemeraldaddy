name: Apply merged Draconic regression fixes

on:
  push:
    branches:
      - fix/draconic-position-highlighting-retcon-node

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/draconic-position-highlighting-retcon-node
          fetch-depth: 0

      - name: Apply asserted fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ephemeraldaddy/gui/features/charts/chart_data_output.py')
          text = path.read_text()
          anchor = '''def _is_chart_data_section_header(text: str) -> bool:\n    return text.strip().upper() in _CHART_DATA_SECTION_HEADER_NAMES\n'''
          replacement = '''def _is_chart_data_section_header(text: str) -> bool:\n    return text.strip().upper() in _CHART_DATA_SECTION_HEADER_NAMES\n\n\n_POSITION_ROW_COLOR_SECTIONS = frozenset(\n    {\n        "POSITIONS",\n        "POSITIONS (Tropical)",\n        "POSITIONS (Draconic)",\n        "UNCERTAIN TIME VARIANTS",\n    }\n)\n\n\ndef _is_position_row_color_section(section: str) -> bool:\n    return section in _POSITION_ROW_COLOR_SECTIONS\n'''
          assert text.count(anchor) == 1, 'chart-data header helper anchor changed'
          text = text.replace(anchor, replacement, 1)

          old_guard = '''    def _apply_positions_row_colors(self, text: str, stripped_text: str) -> None:\n        current_section = self._current_chart_data_section()\n        if current_section not in {"POSITIONS", "UNCERTAIN TIME VARIANTS"}:\n            return\n'''
          new_guard = '''    def _apply_positions_row_colors(self, text: str, stripped_text: str) -> None:\n        current_section = self._current_chart_data_section()\n        if not _is_position_row_color_section(current_section):\n            return\n'''
          assert text.count(old_guard) == 1, f'expected one positions row-color guard, found {text.count(old_guard)}'
          text = text.replace(old_guard, new_guard, 1)
          path.write_text(text)

          path = Path('ephemeraldaddy/gui/features/charts/text_summary.py')
          text = path.read_text()
          old_import = '''from ephemeraldaddy.core.chart import (\n    Chart,\n    apply_unknown_sign_metadata,\n    rectification_range_midpoint_minutes,\n    rectification_range_minutes,\n)\n'''
          new_import = '''from ephemeraldaddy.core.chart import (\n    Chart,\n    _effective_chart_datetime,\n    apply_unknown_sign_metadata,\n    rectification_range_midpoint_minutes,\n    rectification_range_minutes,\n)\n'''
          assert text.count(old_import) == 1, 'core.chart import block changed'
          text = text.replace(old_import, new_import, 1)

          helper_anchor = '''def _header_matches(line: str, aliases: tuple[str, ...]) -> bool:\n    return line.strip() in aliases\n'''
          helper_replacement = '''def _header_matches(line: str, aliases: tuple[str, ...]) -> bool:\n    return line.strip() in aliases\n\n\ndef _planetary_positions_at_effective_chart_time(chart: Chart) -> dict:\n    effective_dt = _effective_chart_datetime(chart)\n    if effective_dt is None:\n        return {}\n    return planetary_positions(effective_dt, chart.lat, chart.lon)\n'''
          assert text.count(helper_anchor) == 1, 'text-summary helper anchor changed'
          text = text.replace(helper_anchor, helper_replacement, 1)

          old_fallback = '''    draconic_source_positions = dict(chart.positions)\n    if draconic_source_positions.get("Rahu") is None:\n        try:\n            refreshed_positions = planetary_positions(chart.dt, chart.lat, chart.lon)\n        except Exception:\n            refreshed_positions = {}\n        if isinstance(refreshed_positions, dict):\n            draconic_source_positions.update(refreshed_positions)\n'''
          new_fallback = '''    draconic_source_positions = dict(chart.positions)\n    if draconic_source_positions.get("Rahu") is None:\n        try:\n            refreshed_positions = _planetary_positions_at_effective_chart_time(chart)\n        except Exception:\n            refreshed_positions = {}\n        if isinstance(refreshed_positions, dict):\n            draconic_source_positions.update(refreshed_positions)\n'''
          assert text.count(old_fallback) == 1, 'Draconic Rahu fallback changed'
          text = text.replace(old_fallback, new_fallback, 1)
          path.write_text(text)

          path = Path('tests/test_chart_data_position_headers.py')
          text = path.read_text()
          addition = '''\n\ndef test_position_row_coloring_accepts_qualified_position_sections() -> None:\n    from ephemeraldaddy.gui.features.charts.chart_data_output import _is_position_row_color_section\n\n    assert _is_position_row_color_section("POSITIONS")\n    assert _is_position_row_color_section("POSITIONS (Tropical)")\n    assert _is_position_row_color_section("POSITIONS (Draconic)")\n    assert _is_position_row_color_section("UNCERTAIN TIME VARIANTS")\n    assert not _is_position_row_color_section("ASPECTS")\n\n\ndef test_draconic_node_refresh_uses_rectified_effective_datetime(monkeypatch) -> None:\n    import datetime\n    from types import SimpleNamespace\n\n    from ephemeraldaddy.gui.features.charts import text_summary\n\n    official_dt = datetime.datetime(2000, 1, 2, 10, 15, tzinfo=datetime.timezone.utc)\n    chart = SimpleNamespace(\n        dt=official_dt,\n        lat=40.0,\n        lon=-74.0,\n        birthtime_unknown=False,\n        retcon_time_used=True,\n        retcon_hour=14,\n        retcon_minute=37,\n        use_birth_time_data=True,\n    )\n    captured = {}\n\n    def fake_planetary_positions(dt, lat, lon):\n        captured["dt"] = dt\n        captured["lat"] = lat\n        captured["lon"] = lon\n        return {"Rahu": 123.0}\n\n    monkeypatch.setattr(text_summary, "planetary_positions", fake_planetary_positions)\n    result = text_summary._planetary_positions_at_effective_chart_time(chart)\n\n    assert result == {"Rahu": 123.0}\n    assert captured["dt"] == official_dt.replace(hour=14, minute=37, second=0, microsecond=0)\n    assert captured["lat"] == 40.0\n    assert captured["lon"] == -74.0\n'''
          assert 'test_position_row_coloring_accepts_qualified_position_sections' not in text
          text += addition
          path.write_text(text)
          PY

      - name: Validate syntax
        run: |
          python -m py_compile \
            ephemeraldaddy/gui/features/charts/chart_data_output.py \
            ephemeraldaddy/gui/features/charts/text_summary.py \
            tests/test_chart_data_position_headers.py

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
          python -m pip install -e ".[test]"

      - name: Run focused regression tests
        run: python -m pytest -q tests/test_chart_data_position_headers.py tests/test_draconic.py

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/_temporary_apply_draconic_merged_fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Draconic position highlighting and rectified node time"
          git push origin HEAD:fix/draconic-position-highlighting-retcon-node
