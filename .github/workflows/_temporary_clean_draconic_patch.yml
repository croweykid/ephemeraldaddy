name: Clean Draconic patch metadata

on:
  push:
    branches:
      - fix/draconic-position-highlighting-retcon-node

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/draconic-position-highlighting-retcon-node
          fetch-depth: 0
      - name: Restore generated metadata and remove helper workflow
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- \
            ephemeraldaddy.egg-info/PKG-INFO \
            ephemeraldaddy.egg-info/SOURCES.txt \
            ephemeraldaddy.egg-info/requires.txt
          rm .github/workflows/_temporary_clean_draconic_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove generated package metadata from Draconic fix"
          git push origin HEAD:fix/draconic-position-highlighting-retcon-node
